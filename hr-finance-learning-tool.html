<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<!-- BEGIN-PAGE -->
<title>The People Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a ledger book. Left rail = table of contents (modules), right page = the lesson.
   Accent "ledger green" carries finance; amber marks every "HR lens" translation. */
:root {
  --paper: #F2F5F3;
  --surface: #FFFFFF;
  --sunk: #E8EEEB;
  --ink: #14211D;
  --muted: #56675F;
  --line: #D3DDD8;
  --ledger: #1C6A56;
  --ledger-ink: #FFFFFF;
  --ledger-soft: #DFEEE8;
  --hr: #94570F;
  --hr-soft: #F7ECDA;
  --good: #2B7A39;
  --good-soft: #E1F1E2;
  --warn: #9A6A00;
  --warn-soft: #FBF1D3;
  --bad: #AE3A2D;
  --bad-soft: #F9E3E0;
  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1614; --surface: #15201D; --sunk: #1B2824; --ink: #E3ECE8; --muted: #9AADA5; --line: #2A3B36;
    --ledger: #5BC0A2; --ledger-ink: #0B1513; --ledger-soft: #16362E;
    --hr: #E2A75A; --hr-soft: #35260F;
    --good: #72C980; --good-soft: #17301B; --warn: #E6BE5A; --warn-soft: #33290D; --bad: #EF7F72; --bad-soft: #3A1B17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1614; --surface: #15201D; --sunk: #1B2824; --ink: #E3ECE8; --muted: #9AADA5; --line: #2A3B36;
  --ledger: #5BC0A2; --ledger-ink: #0B1513; --ledger-soft: #16362E;
  --hr: #E2A75A; --hr-soft: #35260F;
  --good: #72C980; --good-soft: #17301B; --warn: #E6BE5A; --warn-soft: #33290D; --bad: #EF7F72; --bad-soft: #3A1B17;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--paper); }
body { margin: 0; color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); }
h2 { font-size: clamp(1.45rem, 3vw, 1.8rem); }
h3 { font-size: 1.2rem; }
p { margin: 0; }
a { color: var(--ledger); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ledger); outline-offset: 2px; border-radius: 4px; }
.num, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: .74rem; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }

/* App shell */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); border-bottom: 1px solid var(--line); }
.topbar-inner { max-width: 1180px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; }
.brand-mark { font-family: var(--font-display); font-size: 1.3rem; }
.brand-sub { font-size: .8rem; color: var(--muted); }
.progress { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: .85rem; color: var(--muted); }
.progress-track { width: 120px; height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.progress-fill { height: 100%; background: var(--ledger); width: 0; transition: width .4s ease; }

.shell { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 64px; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 40px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); display: grid; gap: 4px; }
.rail-label { margin-block: 4px 8px; }
.rail-btn { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: var(--radius); padding: 10px 10px; cursor: pointer; }
.rail-btn:hover { background: var(--sunk); }
.rail-btn[aria-current="page"] { background: var(--surface); border-color: var(--line); }
.rail-no { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; text-align: center; padding: 2px 0; }
.rail-btn[aria-current="page"] .rail-no { background: var(--ledger); color: var(--ledger-ink); border-color: var(--ledger); }
.rail-title { font-size: .92rem; font-weight: 600; line-height: 1.3; }
.rail-sub { display: block; font-size: .78rem; font-weight: 400; color: var(--muted); }
.tick { font-size: .78rem; color: var(--good); font-weight: 700; }
.rail hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; width: 100%; }

main { min-width: 0; }
.page { display: grid; gap: 28px; max-width: 760px; }

/* Welcome */
.hero { display: grid; gap: 14px; }
.hero p.lead { font-size: 1.12rem; color: var(--muted); max-width: 62ch; }
.why { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.why-item { padding: 16px; border-top: 3px solid var(--hr); background: var(--surface); border-radius: 0 0 var(--radius) var(--radius); display: grid; gap: 6px; align-content: start; }
.why-item strong { font-size: .98rem; }
.why-item p { font-size: .9rem; color: var(--muted); }

.menu { display: grid; gap: 14px; }
.menu-card { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 18px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; cursor: pointer; transition: border-color .15s, transform .15s; }
.menu-card:hover { border-color: var(--ledger); transform: translateY(-1px); }
.menu-no { font-family: var(--font-display); font-size: 2.2rem; color: var(--ledger); line-height: 1; }
.menu-card h3 { margin-bottom: 4px; }
.menu-card p { font-size: .92rem; color: var(--muted); }
.menu-src { font-size: .78rem; color: var(--muted); margin-top: 6px; display: block; }
.menu-go { font-weight: 600; color: var(--ledger); white-space: nowrap; }

/* Lesson */
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.step-chip { font-size: .8rem; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; background: none; cursor: pointer; color: var(--muted); }
.step-chip[aria-current="step"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.step-chip.done { color: var(--good); border-color: var(--good); }

.lesson-head { display: grid; gap: 10px; }
.lesson-head .src { font-size: .85rem; color: var(--muted); }
.prose { display: grid; gap: 14px; max-width: 66ch; }
.prose ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.prose li::marker { color: var(--ledger); }

.callout { border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 8px; }
.callout .eyebrow { color: inherit; }
.callout.hr { background: var(--hr-soft); }
.callout.hr .eyebrow { color: var(--hr); }
.callout.book { background: var(--surface); border: 1px solid var(--line); }
.callout.book .eyebrow { color: var(--ledger); }
.callout.secret { background: var(--ledger-soft); }
.callout.secret .eyebrow { color: var(--ledger); }
.callout p, .callout li { font-size: .95rem; }
.callout ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }

.jargon { display: flex; flex-wrap: wrap; gap: 8px; }
.term { border: 1px dashed var(--ledger); color: var(--ledger); background: none; border-radius: 6px; padding: 2px 10px; font-size: .85rem; cursor: pointer; }
.term:hover { background: var(--ledger-soft); }
.term-pop { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 6px; font-size: .92rem; }
.term-pop .hrline { color: var(--hr); }

/* T-account (the ledger) */
.taccount { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.taccount-title { text-align: center; padding: 10px; font-family: var(--font-display); border-bottom: 2px solid var(--ink); }
.taccount-cols { display: grid; grid-template-columns: 1fr 1fr; }
.taccount-col { padding: 14px 16px; display: grid; gap: 10px; align-content: start; }
.taccount-col + .taccount-col { border-left: 2px solid var(--ink); }
.tline { display: grid; gap: 2px; }
.tline b { font-size: .92rem; }
.tline span { font-size: .82rem; color: var(--muted); }
.tline .q { color: var(--hr); font-weight: 600; font-size: .78rem; }

/* Widgets */
.widget { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: grid; gap: 16px; }
.widget-head { display: grid; gap: 4px; }
.widget-head p { font-size: .9rem; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; width: fit-content; }
.seg button { background: none; border: 0; padding: 7px 14px; cursor: pointer; font-size: .88rem; }
.seg button[aria-pressed="true"] { background: var(--ledger); color: var(--ledger-ink); }
table.ledger { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.ledger td, table.ledger th { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; }
table.ledger th { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
table.ledger td.r, table.ledger th.r { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
table.ledger tr.total td { border-top: 2px solid var(--ink); border-bottom: 0; font-weight: 700; }
.pos { color: var(--good); } .neg { color: var(--bad); }
.table-wrap { overflow-x: auto; }
.slider-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; }
.slider-row label { font-size: .9rem; font-weight: 600; }
.slider-row output { font-family: var(--font-mono); font-size: .95rem; }
.slider-row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--ledger); }
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 120px minmax(0, 1fr) 90px; gap: 10px; align-items: center; font-size: .88rem; }
.bar-track { height: 18px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; transition: width .25s ease; }
.bar-fill.a { background: var(--ledger); } .bar-fill.b { background: var(--hr); }
.bar-row .num { text-align: right; }
.verdict-line { font-size: .95rem; padding: 10px 14px; border-radius: 8px; background: var(--sunk); }

.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 20px; }
.fieldset-title { grid-column: 1 / -1; margin-top: 4px; }
.field { display: grid; gap: 4px; }
.field label { font-size: .84rem; color: var(--muted); }
.field input { font-family: var(--font-mono); font-size: .95rem; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); width: 100%; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--sunk); border-radius: 8px; padding: 12px; display: grid; gap: 2px; }
.stat .v { font-family: var(--font-mono); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.stat .k { font-size: .78rem; color: var(--muted); }
.pill { display: inline-block; font-size: .78rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }

/* Exercise */
.exercise { border: 2px solid var(--ink); border-radius: var(--radius); background: var(--surface); padding: 22px; display: grid; gap: 16px; }
.exercise .scenario { display: grid; gap: 10px; }
.exercise .scenario p { font-size: .97rem; }
.facts { background: var(--sunk); border-radius: 8px; padding: 12px 16px; font-size: .92rem; }
.facts ul { margin: 0; padding-left: 1.1em; display: grid; gap: 3px; }
.choices { display: grid; gap: 10px; }
.choice { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; font-size: .95rem; }
.choice:hover { border-color: var(--ledger); }
.choice[aria-pressed="true"] { border-color: var(--ledger); background: var(--ledger-soft); }
.choice .letter { font-family: var(--font-mono); font-weight: 500; border: 1px solid var(--line); border-radius: 6px; text-align: center; line-height: 24px; height: 26px; background: var(--surface); }
.choice[aria-pressed="true"] .letter { background: var(--ledger); color: var(--ledger-ink); border-color: var(--ledger); }
.choice.is-right { border-color: var(--good); }
.choice.is-wrong { border-color: var(--bad); }
textarea { width: 100%; min-height: 96px; resize: vertical; font: inherit; font-size: .95rem; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); }
.reason-label { font-size: .9rem; font-weight: 600; }
.reason-hint { font-size: .82rem; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: .92rem; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ledger); color: var(--ledger-ink); border-color: var(--ledger); }
.btn.primary:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.form-note { font-size: .85rem; color: var(--bad); }
.feedback { display: grid; gap: 14px; border-top: 1px dashed var(--line); padding-top: 16px; }
.feedback h3 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.feedback .you-said { font-size: .9rem; color: var(--muted); border-left: 3px solid var(--line); padding-left: 12px; font-style: italic; }
.feedback ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; font-size: .95rem; }

/* What next */
.next { background: var(--ink); color: var(--paper); border-radius: var(--radius); padding: 22px; display: grid; gap: 14px; }
.next h3 { color: var(--paper); }
.next p { color: color-mix(in srgb, var(--paper) 78%, transparent); font-size: .95rem; }
.next .actions .btn { background: transparent; color: var(--paper); border-color: color-mix(in srgb, var(--paper) 35%, transparent); }
.next .actions .btn:hover { border-color: var(--paper); }
.next .actions .btn.primary { background: var(--paper); color: var(--ink); border-color: var(--paper); }

.pager { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* Glossary */
.gloss { display: grid; gap: 10px; }
.gloss-search { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); width: 100%; }
.gloss details { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 0 16px; }
.gloss summary { cursor: pointer; padding: 14px 0; font-weight: 600; display: flex; justify-content: space-between; gap: 10px; }
.gloss summary span { font-weight: 400; color: var(--muted); font-size: .88rem; }
.gloss details > div { padding-bottom: 14px; display: grid; gap: 8px; font-size: .95rem; }
.gloss .hrline { color: var(--hr); }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 20px; padding-inline: 16px; }
  .rail { position: static; grid-auto-flow: column; grid-auto-columns: minmax(150px, 1fr); overflow-x: auto; padding-bottom: 4px; }
  .rail-label, .rail hr { display: none; }
  .rail-btn { grid-template-columns: 30px 1fr; }
  .rail-btn .tick { display: none; }
  .rail-sub { display: none; }
  .why { grid-template-columns: minmax(0, 1fr); }
  .topbar-inner { padding: 10px 16px; }
  .progress-track { width: 70px; }
}
@media (max-width: 560px) {
  .menu-card { grid-template-columns: 44px minmax(0, 1fr); }
  .menu-go { grid-column: 2; }
  .menu-no { font-size: 1.7rem; }
  .fields, .stats { grid-template-columns: minmax(0, 1fr); }
  .taccount-cols { grid-template-columns: minmax(0, 1fr); }
  .taccount-col + .taccount-col { border-left: 0; border-top: 2px solid var(--ink); }
  .bar-row { grid-template-columns: 84px minmax(0, 1fr) 76px; }
  .brand-sub { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<header class="topbar">
  <div class="topbar-inner">
    <button class="brand" id="brand" type="button" aria-label="Back to the welcome page">
      <span class="brand-mark">The People Ledger</span>
      <span class="brand-sub">Corporate finance for HR partners</span>
    </button>
    <div class="progress" aria-live="polite">
      <span id="progress-text">0 of 6 exercises</span>
      <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
  </div>
</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Modules"></nav>
  <main id="main" tabindex="-1"></main>
</div>

<script>
(function () {
  "use strict";

  /* ---------- Storage (optional, per viewer) ---------- */
  var STORE_KEY = "people-ledger-v1";
  function loadState() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; }
  }
  function saveState() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
  }
  var state = loadState();
  state.done = state.done || {};

  /* ---------- Glossary: jargon -> plain English -> HR analogy ---------- */
  var GLOSSARY = {
    "balance sheet": { plain: "A snapshot, on one specific day, of everything the company owns and who paid for it.", hr: "Like a headcount report run on 31 December: true for that day only. The next day it has already changed.", ch: "Ch. 1–2" },
    "assets": { plain: "Things the company owns that will bring in cash: cash itself, money customers owe, inventory, buildings, equipment, patents.", hr: "Your trained, retained workforce creates value, but accounting does not list people as assets. Their value shows up in the stock price instead.", ch: "Ch. 2" },
    "liabilities": { plain: "Money the company owes to others: suppliers, lenders, and employees.", hr: "Wages earned but not yet paid, unused vacation that must be paid out, and pension promises are all liabilities. HR creates many of them.", ch: "Ch. 2" },
    "shareholders' equity": { plain: "What would be left for the owners if the company sold everything it owns and paid off everything it owes.", hr: "Think of it as the owners' stake in the business, the part that grows when the company creates value.", ch: "Ch. 2" },
    "capital budgeting": { plain: "Deciding which long-term investments are worth making: new factories, systems, products.", hr: "The same thinking as approving a new team: a cost now in exchange for benefits over several years.", ch: "Ch. 1" },
    "capital structure": { plain: "The mix of borrowed money (debt) and owners' money (equity) the company uses to pay for its assets.", hr: "Like deciding whether a new program is funded from your existing budget or from a loan you must repay with interest.", ch: "Ch. 1" },
    "net working capital": { plain: "Short-term assets (cash, money customers owe, inventory) minus bills due within a year.", hr: "Your cushion for making payroll. If customers pay in 60 days but staff are paid every 2 weeks, this cushion has to cover the gap.", ch: "Ch. 1–2" },
    "cash flow": { plain: "Actual money moving in or out of the bank account, as opposed to profit recorded on paper.", hr: "Payroll is paid in cash, never in profit. A profitable company can still struggle to pay its people on time.", ch: "Ch. 1–2" },
    "free cash flow": { plain: "Cash left over after the company pays for operations and the investments it needs. It can go back to lenders and owners.", hr: "This is the pool that ultimately funds raises, bonuses and new hires without borrowing.", ch: "Ch. 2" },
    "depreciation": { plain: "Spreading the cost of a long-lived item (like a laptop or a building) over the years it is used. It reduces profit but no cash leaves that year.", hr: "If you buy 100 laptops for new hires, the full cash goes out on day one, but the expense shows up a slice at a time over 3–5 years.", ch: "Ch. 2" },
    "book value vs. market value": { plain: "Book value is what the accounts say an asset cost. Market value is what someone would actually pay for it today.", hr: "Good management and a strong culture never appear on the balance sheet, yet they push market value above book value.", ch: "Ch. 2" },
    "current ratio": { plain: "Current assets divided by current liabilities. Above 1 means short-term resources exceed short-term bills.", hr: "A quick health check: can the company cover the next 12 months of bills, payroll included, from what it has coming in?", ch: "Ch. 3" },
    "quick ratio": { plain: "Like the current ratio, but leaves out inventory because inventory can be hard to turn into cash quickly.", hr: "A staffing firm like ManpowerGroup holds almost no inventory, so its quick ratio equals its current ratio. Its \"product\" is people, paid weekly.", ch: "Ch. 3" },
    "agency problem": { plain: "The conflict that arises when someone (the agent) is hired to act for someone else (the principal) but has different incentives.", hr: "Every incentive plan you design is an attempt to solve this: making what is good for the employee also good for the owners.", ch: "Ch. 1" },
    "agency costs": { plain: "The costs created by that conflict: lost opportunities, perks that benefit managers but not owners, and the cost of monitoring.", hr: "Audit fees, a lavish executive jet, or a manager who blocks a smart but risky project to protect their own job.", ch: "Ch. 1" },
    "stakeholders": { plain: "Anyone with a potential claim on the company's cash flows: employees, customers, suppliers, government.", hr: "Employees are stakeholders. Their claim is paid through wages, benefits and pensions.", ch: "Ch. 1" },

    }
    if (d.reason.trim()) {
      html += '<div style="display:grid;gap:8px"><span class="eyebrow">On your reasoning</span><p class="you-said">“' + esc(d.reason.trim()) + '”</p>';
      if (hits.length) {
        html += '<ul>' + hits.map(function (h) { return '<li>' + h.note + '</li>'; }).join("") + '</ul>';
        if (hits.length < ex.keywords.length) {
          var miss = ex.keywords.filter(function (k) { return hits.indexOf(k) === -1; })[0];
          html += '<p><b>One more angle to add:</b> ' + miss.hint + '</p>';
        }
      } else {
        html += '<p>' + ex.missing + '</p><p><b>Points a strong answer covers:</b></p><ul>' + ex.keywords.map(function (k) { return '<li>' + k.hint + '</li>'; }).join("") + '</ul>';
      }
      html += '</div>';
    } else {
      html += '<p><i>Tip:</i> adding a sentence of reasoning next time gets you feedback on your thinking, not just your choice.</p>';
    }
    html += '<div class="callout secret"><span class="eyebrow">The finance secret</span>' + ex.secret + '</div></div>';
    return html;
  }

  function bindExercise(m, ex) {
    var d = draft[ex.id];
    $$(".choice", mainEl).forEach(function (b) {
      b.addEventListener("click", function () {
        d.choice = +b.getAttribute("data-choice");
        $$(".choice", mainEl).forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
        var note = $("#ex-note"); if (note) note.hidden = true;
      });
    });
    var ta = $("#reason-" + ex.id);
    if (ta) ta.addEventListener("input", function () { d.reason = ta.value; });
    var submit = $("#ex-submit");
    if (submit) submit.addEventListener("click", function () {
      if (d.choice === null) { $("#ex-note").hidden = false; return; }
      d.reason = ta.value; d.submitted = true;
      state.done[ex.id] = true; saveState(); updateProgress(); renderRail();
      renderModule();
      var fb = $("#ex-feedback"); if (fb) fb.scrollIntoView({ behavior: "smooth", block: "start" });
    });
    var retry = $("#ex-retry");
    if (retry) retry.addEventListener("click", function () {
      draft[ex.id] = { choice: null, reason: "", submitted: false };
      renderModule();
    });
  }

  /* ---------- What next ---------- */
  function nextPanel(ctx, m) {
    var html = '<section class="next" aria-label="What next"><h3>What would you like to do next?</h3>';
    if (ctx === "home") {
      html += '<p>New to finance? Module 1 builds the foundation the other two rely on. Already comfortable with the basics? Jump straight to pay and incentives in Module 3.</p><div class="actions">' +
        '<button class="btn primary" data-go="m1">Start Module 1</button><button class="btn" data-go="m3">Jump to pay & incentives</button><button class="btn" data-go="glossary">Open the jargon translator</button></div>';
    } else {
      var idx = MODULES.indexOf(m);
      var other = view.exIndex === 0 ? 1 : 0;
      var nextMod = MODULES[(idx + 1) % MODULES.length];
      html += '<p>Nice work. You can try the other exercise in this module, move to a new module, or dig into a concept you want to understand better.</p><div class="actions">' +
        '<button class="btn primary" data-ex="' + other + '">Try another exercise</button>' +
        '<button class="btn" data-go="' + nextMod.id + '">Module ' + nextMod.no + ': ' + esc(nextMod.short) + '</button>' +
        '<button class="btn" data-step="0">Review this lesson</button>' +
        '<button class="btn" data-go="glossary">Dive deeper on a term</button>' +
        '<button class="btn" data-go="home">Back to all modules</button></div>';
    }
    return html + '</section>';
  }

  /* ---------- Glossary ---------- */
  function renderGlossary(focus) {
    var html = '<div class="page"><header class="lesson-head"><span class="eyebrow">Dive deeper</span><h1>Jargon translator</h1><p class="src">Every term from the modules, in plain English, with an HR analogy. Search or open any term.</p></header>' +
      '<label class="eyebrow" for="gloss-q">Search terms</label><input class="gloss-search" id="gloss-q" type="search" placeholder="Try “WACC”, “clawback” or “payroll”"><div class="gloss" id="gloss-list">';
    Object.keys(GLOSSARY).forEach(function (k) {
      var g = GLOSSARY[k];
      html += '<details data-k="' + esc(k.toLowerCase() + " " + g.plain.toLowerCase() + " " + g.hr.toLowerCase()) + '"' + (focus === k ? ' open' : '') + '><summary>' + esc(k) + '<span>' + esc(g.ch) + '</span></summary><div><p>' + esc(g.plain) + '</p><p class="hrline"><b>HR analogy:</b> ' + esc(g.hr) + '</p></div></details>';
    });
    html += '</div>' + '<section class="next"><h3>What would you like to do next?</h3><p>Pick a module to see these terms in action, or come back here any time a word trips you up.</p><div class="actions">' +
      MODULES.map(function (m, i) { return '<button class="btn' + (i === 0 ? ' primary' : '') + '" data-go="' + m.id + '">Module ' + m.no + ': ' + esc(m.short) + '</button>'; }).join("") + '</div></section></div>';
    mainEl.innerHTML = html;
    var q = $("#gloss-q");
    q.addEventListener("input", function () {
      var v = q.value.trim().toLowerCase();
      $$("#gloss-list details").forEach(function (d) { d.hidden = v && d.getAttribute("data-k").indexOf(v) === -1; });
    });
  }

  /* ---------- Widgets ---------- */
  function mountWidgets() {
    var w;
    if ((w = $("#w-midland"))) midland(w);
    if ((w = $("#w-timing"))) timing(w);
    if ((w = $("#w-nwc"))) nwc(w);
    if ((w = $("#w-options"))) options(w);
  }

  function midland(el) {
    var mode = "acct";
    function draw() {
      var acct = mode === "acct";
      el.innerHTML = '<div class="widget-head"><span class="eyebrow">Interactive · Midland Company, year-end</span><p>Same transactions, two lenses.</p></div>' +
        '<div class="seg" role="group" aria-label="View"><button aria-pressed="' + acct + '" data-m="acct">Accounting view</button><button aria-pressed="' + !acct + '" data-m="cash">Cash view</button></div>' +
        '<div class="table-wrap"><table class="ledger"><tbody>' +
        (acct
          ? '<tr><td>Sales (recorded when sold)</td><td class="r">$1,000,000</td></tr><tr><td>Cost of the gold</td><td class="r">−$900,000</td></tr><tr class="total"><td>Profit</td><td class="r pos">$100,000</td></tr>'
          : '<tr><td>Cash received from customer</td><td class="r">$0</td></tr><tr><td>Cash paid for gold</td><td class="r">−$900,000</td></tr><tr class="total"><td>Cash flow</td><td class="r neg">−$900,000</td></tr>') +
        '</tbody></table></div>' +
        '<p class="verdict-line">' + (acct
          ? 'Accounting says Midland made <b>$100,000</b>. Good news for a bonus calculation.'
          : 'The bank account is <b>$900,000 lower</b>. If payroll were due tomorrow, this is the number that matters.') + '</p>';
      $$("[data-m]", el).forEach(function (b) { b.addEventListener("click", function () { mode = b.getAttribute("data-m"); draw(); $("[data-m=" + mode + "]", el).focus(); }); });
    }
    draw();
  }

  function timing(el) {
    var rate = 10;
    el.innerHTML = '<div class="widget-head"><span class="eyebrow">Interactive · what is each product worth today?</span><p>The rate is how strongly the company prefers money sooner. Higher rates mean waiting is more costly.</p></div>' +
      '<div class="slider-row"><label for="rate">Company\'s rate for waiting</label><output id="rate-out">10%</output><input id="rate" type="range" min="0" max="25" step="1" value="10"></div>' +
      '<div class="bars" id="t-bars"></div><p class="verdict-line" id="t-verdict"></p>';
    var input = $("#rate", el);
    function pv(flows, r) { return flows.reduce(function (s, f, i) { return s + f / Math.pow(1 + r, i + 1); }, 0); }
    function draw() {
      var r = rate / 100;
      var a = pv([0, 0, 0, 20000], r), b = pv([4000, 4000, 4000, 4000], r);
      var max = 20000;
      $("#rate-out", el).textContent = rate + "%";
      $("#t-bars", el).innerHTML =
        '<div class="bar-row"><span>Product A</span><div class="bar-track"><div class="bar-fill a" style="width:' + (a / max * 100) + '%"></div></div><span class="num">' + money(a) + '</span></div>' +
        '<div class="bar-row"><span>Product B</span><div class="bar-track"><div class="bar-fill b" style="width:' + (b / max * 100) + '%"></div></div><span class="num">' + money(b) + '</span></div>' +
        '<div class="bar-row"><span style="color:var(--muted)">Cost of each</span><div class="bar-track"><div class="bar-fill" style="width:50%;background:var(--line)"></div></div><span class="num">$10,000</span></div>';
      var winner = a > b ? "A" : "B";
      $("#t-verdict", el).innerHTML = rate === 0
        ? 'With no preference for timing, A looks better simply because <b>$20,000 &gt; $16,000</b>.'
        : 'At ' + rate + '%, Product <b>' + winner + '</b> is worth more today. ' + (winner === "B" ? 'Getting cash every year beats waiting four years for a bigger lump.' : 'The bigger lump still wins, but the gap is far smaller than the totals suggest.');
    }
    input.addEventListener("input", function () { rate = +input.value; draw(); });
    draw();
  }

  function nwc(el) {
    var f = { cash: 2.0, ar: 3.0, inv: 1.0, ap: 1.5, pay: 0.9, loan: 0.6 };
    var labels = { cash: "Cash", ar: "Money customers owe us", inv: "Inventory", ap: "Supplier bills due", pay: "Payroll due in 2 weeks", loan: "Short-term loan" };
    var html = '<div class="widget-head"><span class="eyebrow">Interactive · payroll safety check ($ millions, sample company)</span><p>Change any number. The sample values match the Module 2 exercise.</p></div><div class="fields">' +
      '<span class="eyebrow fieldset-title">Current assets</span>';
    ["cash", "ar", "inv"].forEach(function (k) { html += '<div class="field"><label for="nwc-' + k + '">' + labels[k] + '</label><input id="nwc-' + k + '" type="number" min="0" step="0.1" value="' + f[k] + '" inputmode="decimal"></div>'; });
    html += '<span class="eyebrow fieldset-title">Current liabilities</span>';
    ["ap", "pay", "loan"].forEach(function (k) { html += '<div class="field"><label for="nwc-' + k + '">' + labels[k] + '</label><input id="nwc-' + k + '" type="number" min="0" step="0.1" value="' + f[k] + '" inputmode="decimal"></div>'; });
    html += '</div><div class="stats" id="nwc-stats"></div><p class="verdict-line" id="nwc-verdict"></p>';
    el.innerHTML = html;
    function draw() {
      var ca = f.cash + f.ar + f.inv, cl = f.ap + f.pay + f.loan;
      var n = ca - cl, cr = cl ? ca / cl : Infinity, qr = cl ? (ca - f.inv) / cl : Infinity;
      var dueSoon = f.ap + f.pay;
      $("#nwc-stats", el).innerHTML =
        '<div class="stat"><span class="v">' + moneyM(n) + '</span><span class="k">Net working capital</span></div>' +
        '<div class="stat"><span class="v">' + (isFinite(cr) ? cr.toFixed(2) : "—") + '</span><span class="k">Current ratio</span></div>' +
        '<div class="stat"><span class="v">' + (isFinite(qr) ? qr.toFixed(2) : "—") + '</span><span class="k">Quick ratio</span></div>';
      var v;
      if (f.cash >= dueSoon) v = '<span class="pill good">Covered</span> Cash of ' + moneyM(f.cash) + ' covers payroll and supplier bills due this month (' + moneyM(dueSoon) + ').';
      else if (f.cash >= f.pay) v = '<span class="pill warn">Tight</span> Payroll (' + moneyM(f.pay) + ') is covered, but payroll plus supplier bills (' + moneyM(dueSoon) + ') exceed cash. The company is relying on customers paying on time.';
      else v = '<span class="pill bad">At risk</span> Cash (' + moneyM(f.cash) + ') does not cover the next payroll (' + moneyM(f.pay) + '). The company would need to borrow or collect fast.';
      if (n > 0 && f.cash < dueSoon) v += ' Notice that net working capital is still positive: the cushion exists on paper, not yet in the bank.';
      $("#nwc-verdict", el).innerHTML = v;
    }
    Object.keys(f).forEach(function (k) {
      var inp = $("#nwc-" + k, el);
      inp.addEventListener("input", function () { var x = parseFloat(inp.value); f[k] = isFinite(x) && x >= 0 ? x : 0; draw(); });
    });
    draw();
  }

  function options(el) {
    var price = 65, strike = 50, nOpt = 1000, nRsu = 250;
    el.innerHTML = '<div class="widget-head"><span class="eyebrow">Interactive · options vs. RSUs</span><p>Both grants were made when the stock was $50, so the option strike price is $50. Where might the stock go?</p></div>' +
      '<div class="slider-row"><label for="px">Share price at vesting</label><output id="px-out">$65</output><input id="px" type="range" min="20" max="100" step="1" value="65"></div>' +
      '<div class="bars" id="o-bars"></div><p class="verdict-line" id="o-verdict"></p>';
    var input = $("#px", el);
    function draw() {
      var ov = Math.max(0, price - strike) * nOpt, rv = price * nRsu, max = Math.max(50 * nOpt, 100 * nRsu);
      $("#px-out", el).textContent = "$" + price;
      $("#o-bars", el).innerHTML =
        '<div class="bar-row"><span>1,000 options</span><div class="bar-track"><div class="bar-fill a" style="width:' + (ov / max * 100) + '%"></div></div><span class="num">' + money(ov) + '</span></div>' +
        '<div class="bar-row"><span>250 RSUs</span><div class="bar-track"><div class="bar-fill b" style="width:' + (rv / max * 100) + '%"></div></div><span class="num">' + money(rv) + '</span></div>';
      var v;
      if (price < strike) v = '<span class="pill bad">Underwater</span> At $' + price + ', buying at $50 makes no sense, so the options are worth $0. The RSUs are still worth ' + money(rv) + '. Retention power now sits with the RSUs.';
      else if (price === strike) v = '<span class="pill warn">At the money</span> The options are worth nothing yet. The stock has to rise for them to pay off.';
      else if (ov > rv) v = '<span class="pill good">Options lead</span> Each $1 rise above $50 adds $1,000 to the options but only $250 to the RSUs. Strong upside for strong performance.';
      else v = '<span class="pill warn">RSUs lead</span> The stock is above $50, but not far enough for the options to overtake. Options need a big rise to pay off.';
      $("#o-verdict", el).innerHTML = v;
    }
    input.addEventListener("input", function () { price = +input.value; draw(); });
    draw();
  }

  /* ---------- Term popovers ---------- */
  function showTerm(btn) {
    var k = btn.getAttribute("data-term");
    var g = GLOSSARY[k]; if (!g) return;
    var section = btn.closest("section") || mainEl;
    var slot = $("#term-pop-slot", section) || $("#term-pop-slot");
    if (!slot) return;
    slot.innerHTML = '<div class="term-pop" role="note"><span class="eyebrow">Jargon translator · ' + esc(k) + '</span><p>' + esc(g.plain) + '</p><p class="hrline"><b>HR analogy:</b> ' + esc(g.hr) + '</p><div class="actions"><button class="btn" data-gloss="' + esc(k) + '">See all terms</button></div></div>';
  }

  /* ---------- Navigation ---------- */
  function go(target, opts) {
    opts = opts || {};
    if (target === "home") { view = { name: "home", module: null, step: 0, exIndex: 0 }; }
    else if (target === "glossary") { view = { name: "glossary", module: null, step: 0, exIndex: 0 }; }
    else { view = { name: "module", module: target, step: opts.step || 0, exIndex: opts.exIndex || 0 }; }
    try { history.replaceState(null, "", "#" + target); } catch (e) { /* ignore */ }
    try { state.last = target; saveState(); } catch (e) { /* ignore */ }
    render(opts.focus);
    window.scrollTo(0, 0);
    mainEl.focus({ preventScroll: true });
  }

  function render(focus) {
    renderRail();
    if (view.name === "home") renderHome();
    else if (view.name === "glossary") renderGlossary(focus);
    else renderModule();
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-go],[data-step],[data-ex],[data-term],[data-gloss],#brand");
    if (!t) return;
    if (t.id === "brand") return go("home");
    if (t.hasAttribute("data-go")) return go(t.getAttribute("data-go"));
    if (t.hasAttribute("data-gloss")) return go("glossary", { focus: t.getAttribute("data-gloss") });
    if (t.hasAttribute("data-term")) return showTerm(t);
    if (t.hasAttribute("data-ex")) {
      var m = modById(view.module);
      return go(m.id, { step: m.sections.length, exIndex: +t.getAttribute("data-ex") });
    }
    if (t.hasAttribute("data-step")) {
      view.step = +t.getAttribute("data-step");
      render(); window.scrollTo(0, 0);
    }
  });

  var start = (location.hash || "").replace("#", "");
  updateProgress();
  if (start && (start === "glossary" || modById(start))) go(start);
  else render();
})();
</script>
<!-- END-PAGE -->
</body>
</html>
